<!doctype html>
<!--
  Shadows Left Behind · 30-second Space Apps demo (auto-playing, 16:9, ≤ 30 s)
  Opening: Wayang Kulit meets camera AR (narrated). Put ~21 s of gameplay at ./clips/demo30.mp4; it plays from 0:08 with caption strips. Press K for a clean black slot instead.
  Keys: Space play/pause · ← → seek · H hide controls · F fullscreen · C captions · M mute. Must sit next to index.html.
-->
<html lang="en">
<head><script>
// lets the Record button capture the film's sound: anything played to the speakers is also sent to a recordable stream
(()=>{const orig=AudioNode.prototype.connect;window.__origConnect=orig;
AudioNode.prototype.connect=function(t,...r){const x=orig.call(this,t,...r);if(t instanceof AudioDestinationNode){const c=t.context;c.__dest=c.__dest||c.createMediaStreamDestination();orig.call(this,c.__dest)}return x}})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadows Left Behind · 30-second Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--gold:#ddbc79;--ink:#ede7db;--muted:#9c9d92}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font:14px/1.5 Arial,"Helvetica Neue",sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
body.idle{cursor:none}
#start{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#2a2019 0%,#0b0907 70%);z-index:5;text-align:center;padding:20px}
#start[hidden]{display:none}
#start h1{font:400 clamp(28px,4vw,56px)/1.2 "Noto Serif",Georgia,serif;margin:0 0 8px}
#start p{color:var(--muted);margin:0 0 26px;letter-spacing:2px;font-size:12px;text-transform:uppercase}
#start button{font:600 16px Arial;background:linear-gradient(180deg,#ecd29c,#d4ae6a);color:#221c14;border:0;border-radius:4px;padding:14px 28px;cursor:pointer;box-shadow:0 10px 30px -8px #ddbc79aa}
#start small{display:block;margin-top:18px;color:#6f7468;font-size:12px}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:26px 3% 14px;background:linear-gradient(transparent,#000c);transition:opacity .4s}
body.hide-ui #bar,body.idle #bar{opacity:0;pointer-events:none}
#track{position:relative;height:18px;cursor:pointer}
#track::before{content:"";position:absolute;left:0;right:0;top:8px;height:3px;background:#ffffff30;border-radius:2px}
#fill{position:absolute;left:0;top:8px;height:3px;background:var(--gold);border-radius:2px;width:0}
#track i{position:absolute;top:5px;width:2px;height:9px;background:#ffffffaa}
#knob{position:absolute;top:3px;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:#fff3d2;box-shadow:0 0 10px #ddbc79}
#row{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12px;color:#d6d0c2;flex-wrap:wrap}
#row button{background:none;border:1px solid #ffffff33;color:inherit;border-radius:3px;padding:5px 10px;font:inherit;cursor:pointer}
#row button:hover{border-color:var(--gold)}
#chap{flex:1;min-width:120px;color:var(--gold);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#time{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<canvas id="film" aria-label="Shadows Left Behind narrated demo film"></canvas>

<div id="start">
  <div>
    <h1>余影 · Shadows Left Behind</h1>
    <p>30-second demo · NASA Space Apps 2026 · sound on</p>
    <button id="play-start">▶ Play the demo</button>
    <small>Space pause · ← → seek · H hide controls · F fullscreen · C captions</small>
  </div>
</div>

<div id="bar">
  <div id="track"><div id="fill"></div><div id="knob"></div></div>
  <div id="row">
    <button id="pp">❚❚</button>
    <span id="time">0:00 / 0:00</span>
    <span id="chap"></span>
    <button id="cc">Captions: on</button>
    <button id="mute">Sound: on</button>
    <button id="ui">Hide controls (H)</button>
    <button id="fs">⛶</button>
  </div>
</div>

<script>

/* ================= timeline (30-second Space Apps demo) ================= */
// 0:00 Wayang Kulit × camera AR (narrated) · 0:08 REAL GAMEPLAY (clips/demo30.mp4, game sound) with caption strips.

const SLOT_LENGTHS={DEMO:20.6};   // seconds of gameplay in the film (the clip plays at SLOTS[0].rate); total ≈ 7.8 + this

  o.slotF=o.slotE+L.E;o.how=o.slotF+L.F;o.end=o.how+10.6;o.dur=o.end+13.2;o.rocksFly=1e9;o.beaconOn=1e9;o.beaconReach=1e9;o.scans=[1e9,1e9,1e9];o.lightEnd=1e9;o.carry=[1e9,1e9,1e9];
  return o})();
const SCAN=1.2;
const ND={h:7.49,g0:3.14,g1:4.39,g2:4.92,g3:3.84};
const F=(()=>{const o={open:0};o.h=.3;o.slot=o.h+ND.h+.42;o.dur=o.slot+SLOT_LENGTHS.DEMO;return o})();

const STRIPS=[];

const SLOTS=[{id:'DEMO',t:F.slot,file:'clips/demo30.webm',rate:1.35,title:'Live demo',sub:'About 21 seconds of play',
  shows:['0–5 s   choose Oppy’s book: it floats, opens, draws you in','5–10 s   wave → rocks fly, Oppy wakes','10–15 s   pinch to scan a rock → stars burst, NASA photo appears','15–21 s   carry a memory to the paper Earth']}];
// where in the video to be at `rel` seconds into the slot
function slotLocal(slot,rel){if(!slot.segments)return rel*(slot.rate||1)+(slot.from||0);let a=0;for(const [f,l] of slot.segments){if(rel<a+l)return f+(rel-a);a+=l}const z=slot.segments[slot.segments.length-1];return z[0]+z[1]}
const SEG_CUTS=(()=>{let a=0;return (SLOTS[0].segments||[]).slice(0,-1).map(([,l])=>F.slot+(a+=l))})();
const CHAPTERS=[{t:F.open,name:'Wayang Kulit × camera AR'},{t:F.slot,name:'LIVE DEMO (your clip)'}];
const VOICE=[
 {t:F.h,who:'n',src:'audio/narration30/h.mp3',d:ND.h,text:"Hello. My name is Ling Yew Han (team cina). For Abandoned but not Forgotten, Malaysia's Wayang Kulit inspired Shadows Left Behind."},
 {t:F.slot+.15,who:'n',src:'audio/narration30/g0.mp3',d:ND.g0,text:"Pick a storybook. Oppy's book opens and pulls you in."},
 {t:F.slot+3.5,who:'n',src:'audio/narration30/g1.mp3',d:ND.g1,text:"Your hand is tracked live in AR. Wave, and the shadow puppets move."},
 {t:F.slot+8.2,who:'n',src:'audio/narration30/g2.mp3',d:ND.g2,text:"Pinch to scan the rocks, and real NASA images reveal Opportunity's discoveries."},
 {t:F.slot+14.6,who:'n',src:'audio/narration30/g3.mp3',d:ND.g3,text:"Next come Voyager and the Apollo rover. Abandoned, but not forgotten."}];
const BURSTS=[];
const BELLS=(()=>{const scale=[293.7,329.6,392,440,523.3,587.3],pat=[0,2,3,2,4,3,1,2,0,3,4,5],out=[];let t=.2,i=0;while(t<4.2){out.push({t,f:scale[pat[i%pat.length]],soft:i%2===1});t+=.6;i++}return out})();

/* ================= canvas ================= */
const cv=$('#film'),c=cv.getContext('2d');let VW=0,VH=0,DPR=1;

const IMG={};for(const [k,f] of [['rock','last-chance-rock.jpg'],['shadow','opportunity-shadow.jpg'],['last','opportunity-last-message.jpg']]){const im=new Image();im.src='assets/nasa/'+f;IMG[k]=im}

function glow(x,y,r,rgb,a){if(r<=0||a<=0)return;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${rgb},${a})`);g.addColorStop(.3,`rgba(${rgb},${a*.55})`);g.addColorStop(1,`rgba(${rgb},0)`);c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)}

  if(alpha<=0)return;c.save();c.globalAlpha=alpha;c.textAlign=align;c.textBaseline='alphabetic';
  c.font=`${italic?'italic ':''}${weight} ${size}px ${font==='serif'?'"Noto Serif",Georgia,serif':'Arial,"Helvetica Neue",sans-serif'}`;

function eyebrow(s,x,y,a,align='left'){text(s,x,y,{size:22,font:'sans',weight:700,color:'#ddbc79',spacing:7,alpha:a,align})}

const PAL=[
 ['#f0d7a2','#d7b17a','#997248','#8b674238','#74533844','#e4c48b'],
 ['#f4c397','#cf8d64','#8b5142','#a24e3d64','#713b3061','#f1ce99'],
 ['#b8a48a','#8e7a6a','#65544f','#5b555773','#4a3d406e','#b8aa99'],
 ['#c5d6cc','#8ea9a2','#586f76','#3a596660','#334b566d','#d2e4cf']
];
const GY=H*.8;
function backdrop(pal,t,o={}){
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,pal[0]);g.addColorStop(1,pal[1]);c.fillStyle=g;c.fillRect(0,0,W,H);
  if(o.stars){for(let i=0;i<160;i++){const a=.25+.55*Math.abs(Math.sin(t*1.1+i));c.fillStyle=`rgba(255,250,235,${a})`;const sz=i%7?1.8:3;c.fillRect((i*97.3)%W,(i*53.7)%(H*.6),sz,sz)}}
  if(o.sun!==false){const sx=W*(o.sunX??.78),sy=H*.24,R=H*.075;glow(sx,sy,R*5,'255,242,205',.6);C(sx,sy,R,pal[5])}
  const k=H/500;
  [[.6,pal[3],.12,34],[.7,pal[4],.2,24],[.8,pal[2],.3,14]].forEach(([y,col,sp,amp],n)=>{
    c.beginPath();c.moveTo(0,H);for(let i=0;i<=60;i++){const x=W*i/60;c.lineTo(x,H*y+Math.sin(i/60*6+n*2.1+t*sp)*amp*k+Math.sin(i/60*17+n)*amp*.28*k)}c.lineTo(W,H);c.closePath();c.fillStyle=col;c.fill()});
  c.strokeStyle='rgba(255,232,195,.13)';c.lineWidth=1.5;
  for(let i=0;i<5;i++){c.beginPath();for(let j=0;j<=40;j++){const x=W*j/40,y=H*(.85+i*.032)+Math.sin(j/40*8+i)*3*k;j?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}
  c.fillStyle='rgba(255,246,225,.35)';for(let i=0;i<60;i++)c.fillRect((i*137.5+t*12*(1+i%3))%W,(i*71.3)%(H*.75),2.2,2.2);
}
function vignette(a=.45){const v=c.createRadialGradient(W/2,H*.48,H*.35,W/2,H/2,Math.hypot(W,H)*.58);v.addColorStop(0,'rgba(20,12,8,0)');v.addColorStop(1,`rgba(20,12,8,${a})`);c.fillStyle=v;c.fillRect(0,0,W,H)}
function orbs(t,tint,n=5,pull=W/2){for(let i=0;i<n;i++){let px=W*(.12+.76*(.5+.5*Math.sin(t*.11*(1+i*.23)+i*1.9)));const py=H*(.12+.26*(.5+.5*Math.sin(t*.17*(1+i*.31)+i*2.7)));px+=(pull-px)*.12;
  const pulse=.75+.25*Math.sin(t*2.4+i*1.3),core=26*(1+(i%3)*.25);c.save();c.globalCompositeOperation='screen';glow(px,py,core*3.2,tint,.22*pulse);glow(px,py,core*1.1,tint,.6*pulse);c.restore();C(px,py,4,`rgba(255,250,235,${.8*pulse})`)}}

/* Opportunity as a jointed shadow puppet (same construction as the game) */
function rover(t,px,py,s,o={}){
  const ink=o.ink||'#35291f',gold=o.gold||'#b98b4d',sil=!!o.silhouette;
  c.save();c.translate(px,py);c.scale(s,s);c.translate(0,Math.sin(t*1.4)*2);
  if(o.rods!==false){L([-52,14],[-120,360],2,o.rodColor||'#59432b88');L([31,-48],[90,360],2,o.rodColor||'#59432b88')}
  P([[-92,-15],[65,-15],[96,12],[62,38],[-67,38],[-98,10]],ink);P([[-86,-24],[-9,-48],[83,-22],[15,5]],ink);
  if(!sil){for(let i=0;i<5;i++)L([-70+i*28,-23-i],[i*22-5,-2-i*2],1,gold);
    for(let k=0;k<4;k++){const f=k*27;P([[-76+f,-22],[-54+f,-26],[-36+f,-17],[-58+f,-12]],'#55443c');L([-72+f,-21],[-54+f,-15],.75,'#d5a569')}
    L([-86,11],[58,28],1.6,'#c79557');for(let r=0;r<5;r++)C(-65+r*25,15+r*2,2,'#e0ab69')}
  L([2,-21],[2,-102],9,ink);L([2,-78],[25,-99],5,ink);P([[-26,-119],[31,-119],[38,-89],[-25,-89]],ink);
  const eye=sil?ink:gold;C(-12,-104,7,eye);C(19,-104,7,eye);if(!sil){const p=o.glow?'#ffe9a1':ink;C(-12,-104,3,p);C(19,-104,3,p)}
  L([50,-24],[61,-66],3,ink);c.beginPath();c.ellipse(61,-70,17,6,-.35,0,Math.PI*2);c.fillStyle=ink;c.fill();L([61,-70],[69,-83],2,ink);
  for(let i=0;i<3;i++){const wx=-70+i*70;L([wx*.75,23],[wx,49],6,ink);C(wx,53,20,ink);
    if(!sil){C(wx,53,12,gold);C(wx,53,6,ink);for(let j=0;j<6;j++){const a=j*Math.PI/3+(o.spin??t*.3);L([wx+Math.cos(a)*7,53+Math.sin(a)*7],[wx+Math.cos(a)*16,53+Math.sin(a)*16],2,ink)}}}
  const armY=o.wave?-50+Math.sin(t*9)*25:4+Math.sin(t*2)*10;L([64,22],[110,armY],6,ink);C(63,22,5,sil?ink:gold);C(110,armY,5,ink);
  c.restore()}
const hop=(t,times)=>{for(const h of times){const k=(t-h)/.65;if(k>=0&&k<=1)return Math.sin(k*Math.PI)*34*(1-k*.3)}return 0};
function shadowUnder(x,s){c.fillStyle='rgba(60,40,24,.22)';c.beginPath();c.ellipse(x,GY+8*s,120*s,13*s,0,0,Math.PI*2);c.fill()}

/* ---------- Wayang Kulit motifs (original drawings in the traditional style) ---------- */
// the lit screen (kelir) in a carved frame, lit from behind by an oil lamp
function kelir(x,y,w,h,t,lampX=.5,lit=1){
  c.fillStyle='#2a1a10';c.fillRect(x-26,y-26,w+52,h+52);
  c.strokeStyle='#8a5a2f';c.lineWidth=3;c.strokeRect(x-16,y-16,w+32,h+32);
  for(let i=0;i<Math.floor((w+32)/34);i++){P([[x-16+i*34+17,y-24],[x-16+i*34+26,y-16],[x-16+i*34+17,y-8],[x-16+i*34+8,y-16]],'#a8733e');P([[x-16+i*34+17,y+h+8],[x-16+i*34+26,y+h+16],[x-16+i*34+17,y+h+24],[x-16+i*34+8,y+h+16]],'#a8733e')}
  const fl=1+.04*Math.sin(t*13)+.03*Math.sin(t*7.3),lx=x+w*lampX,ly=y+h*.55;
  const g=c.createRadialGradient(lx,ly,10,lx,ly,Math.max(w,h)*.75*fl);g.addColorStop(0,`rgba(255,236,190,${lit})`);g.addColorStop(.45,`rgba(236,196,128,${lit})`);g.addColorStop(1,`rgba(120,74,36,${lit})`);

  c.strokeStyle='rgba(120,80,40,.08)';c.lineWidth=1;for(let i=0;i<h;i+=6){c.beginPath();c.moveTo(x,y+i);c.lineTo(x+w,y+i);c.stroke()}
}
function holes(pts,r,col){for(const [px,py] of pts)C(px,py,r,col)}
// a leaf-shaped opening puppet (pohon beringin style): pointed top, perforated tree pattern
function leafPuppet(x,y,s,rot,col='#1c130c',holeCol='rgba(250,222,160,.85)'){
  c.save();c.translate(x,y);c.rotate(rot);c.scale(s,s);
  L([0,110],[0,330],4,col);
  c.beginPath();c.moveTo(0,-230);c.quadraticCurveTo(70,-150,88,-40);c.quadraticCurveTo(96,60,40,104);c.lineTo(0,118);c.lineTo(-40,104);c.quadraticCurveTo(-96,60,-88,-40);c.quadraticCurveTo(-70,-150,0,-230);c.closePath();c.fillStyle=col;c.fill();
  c.strokeStyle=holeCol;c.lineWidth=3;c.lineCap='round';
  c.beginPath();c.moveTo(0,100);c.lineTo(0,-170);c.stroke();
  for(let i=0;i<6;i++){const yy=60-i*40,sp=58-i*7;c.beginPath();c.moveTo(0,yy);c.quadraticCurveTo(sp*.5,yy-18,sp,yy-36);c.moveTo(0,yy);c.quadraticCurveTo(-sp*.5,yy-18,-sp,yy-36);c.stroke()}
  const dots=[];for(let i=0;i<7;i++)for(let j=-2;j<=2;j++){const yy=-150+i*36,xx=j*22+(i%2?11:0);if(Math.abs(xx)<70-Math.abs(yy+40)*.12&&Math.abs(j)>0)dots.push([xx,yy])}holes(dots,3.2,holeCol);
  c.beginPath();c.moveTo(-44,96);c.lineTo(44,96);c.stroke();
  c.restore()}
// a jointed wayang figure in profile; arm angles animate, rods run off the bottom
function wayangFigure(x,y,s,t,o={}){
  const col=o.col||'#1c130c',hole=o.hole||'rgba(250,222,160,.85)',sw=o.swing??Math.sin(t*1.7)*.35;
  c.save();c.translate(x,y);c.scale(s,s);
  L([0,150],[0,360],4,col);

  const bs=[-12,-82],be=[-40+Math.sin(sw)*10,-30],bh=[-22+Math.sin(sw)*24,22];

  text('+ camera AR: your hand becomes the puppet rod',W/2,160,{size:48,align:'center',color:'#8fe0f0',alpha:win(t,4.2,F.slot,.4)});
  text('Ling Yew Han  ·  Team cina  ·  Sibu, Malaysia',70,H-40,{size:20,font:'sans',color:'#cdb68a',alpha:win(t,.4,F.slot,.4),shadow:false});
}
function slotCaptions(t){const k=t-F.slot;if(k<0||k>SLOT_LENGTHS.DEMO)return;
  for(const [a,b,s] of STRIPS){const al=win(k,a+.15,b,.35);if(al<=0)continue;
    c.save();c.globalAlpha=al;c.font='600 30px Arial,sans-serif';const w=c.measureText(s).width+64;const x=(W-w)/2,y=H-130;
    c.fillStyle='rgba(20,15,11,.82)';c.beginPath();c.roundRect?c.roundRect(x,y,w,62,31):c.rect(x,y,w,62);c.fill();
    c.strokeStyle='rgba(221,188,121,.6)';c.lineWidth=1.5;c.stroke();C(x+30,y+31,6,'#ddbc79');
    c.fillStyle='#f6e7c8';c.textBaseline='middle';c.textAlign='left';c.fillText(s,x+46,y+32);c.restore()}}
function watermark(){c.save();c.globalAlpha=.75;c.font='600 18px Arial';c.textAlign='right';c.fillStyle='rgba(0,0,0,.45)';const s='AI-assisted  ·  voices: neural TTS';const w=c.measureText(s).width+24;
  c.fillRect(W-40-w,28,w,34);c.fillStyle='#f3e6c8';c.textBaseline='middle';c.fillText(s,W-52,46);c.restore()}
const SCENES=[[F.open,F.slot,sOpen],[F.slot,DURATION,t=>sSlot(t,SLOTS[0])]];

function renderAt(t){
  t=clamp(t,0,DURATION);
  c.setTransform(1,0,0,1,0,0);c.fillStyle='#000';c.fillRect(0,0,cv.width,cv.height);
  const k=Math.min(VW/W,VH/H)*DPR,ox=(cv.width-W*k)/2,oy=(cv.height-H*k)/2;c.setTransform(k,0,0,k,ox,oy);
  c.save();c.beginPath();c.rect(0,0,W,H);c.clip();
  const sc=SCENES.find(([a,b])=>t>=a&&t<b)||SCENES[SCENES.length-1];
  sc[2](sc.length>3?sc[3]+(t-sc[0])*(sc[4]-sc[3])/(sc[1]-sc[0]):t);
  bursts(t);captions(t);watermark();slotCaptions(t);
  for(const [a] of SCENES){if(a===0)continue;const d=Math.abs(t-a);if(d<.45)blackFade(1-d/.45)}for(const a of SEG_CUTS){const d=Math.abs(t-a);if(d<.14)blackFade((1-d/.14)*.85)}
  blackFade(Math.max(seg(.6-t,0,.6),seg(t,DURATION-1.6,DURATION)));
  c.restore();
}
window.renderAt=renderAt;window.DEMO_DURATION=DURATION;

/* ================= playback, audio, controls ================= */
let clock=0,prevClock=0,playing=false,last=0,muted=false,actx=null,pad=null,voiceOut=null;
// Voices are decoded into memory and scheduled on the Web Audio clock, and while playing the film clock IS the
// audio clock — so seeking lands mid-sentence correctly and picture and voice cannot drift (the local Python
// server cannot serve byte ranges, which breaks seeking with plain <audio>). Opened as a file:// page, fetch is
// blocked, so it falls back to <audio> elements that start each clip at its cue.
let webAudio=false,scheduled=false,ctxBase=0,clockBase=0,sources=[];
const clips=VOICE.map(v=>({...v,el:null,on:false,buf:null}));
function ensureCtx(){if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();voiceOut=actx.createGain();voiceOut.connect(actx.destination)}return actx}
// version tag so a browser never plays a cached older narration (bump it after regenerating the voices)
const AUDIO_V=Object.values(ND).join('-');
async function loadVoices(){try{ensureCtx();await Promise.all(clips.map(async cl=>{const r=await fetch(cl.src+'?v='+AUDIO_V,{cache:'no-cache'});if(!r.ok)throw new Error(cl.src);cl.buf=await actx.decodeAudioData(await r.arrayBuffer())}));webAudio=true}
  catch{webAudio=false;clips.forEach(cl=>{cl.el=new Audio(cl.src+'?v='+AUDIO_V);cl.el.preload='auto'})}}
const speaking=()=>webAudio?playing&&clips.some(cl=>clock>=cl.t&&clock<cl.t+cl.d):clips.some(cl=>cl.on);
function stopClips(){sources.forEach(s=>{try{s.stop()}catch{}});sources=[];scheduled=false;clips.forEach(cl=>{cl.el?.pause();cl.on=false})}
function scheduleVoices(){stopClips();ctxBase=actx.currentTime+.06;clockBase=clock;
  for(const cl of clips){if(cl.t+cl.d<=clock)continue;const src=actx.createBufferSource();src.buffer=cl.buf;src.connect(voiceOut);src.start(ctxBase+Math.max(0,cl.t-clock),Math.max(0,clock-cl.t));sources.push(src)}
  scheduled=true}
// fallback (<audio>): start/stop clips for the current clock; returns true while a due clip is still loading
function syncClips(){if(webAudio)return false;let waiting=false;clips.forEach(cl=>{const want=playing&&!muted&&clock>=cl.t&&clock<cl.t+cl.d;
  if(want&&!cl.on){if(cl.el.readyState>=3){cl.el.currentTime=Math.max(0,clock-cl.t);cl.el.play().catch(()=>{});cl.on=true}else waiting=true}
  if(!want&&cl.on){cl.el.pause();cl.on=false}});return waiting}
const voicesReady=loadVoices();
// gameplay clips: load clips/<file> for each slot if it exists (as a blob, so seeking works on the local server)
function attachVideo(slot,src){const v=document.createElement('video');v.preload='auto';v.playsInline=true;v.src=src;
  v.addEventListener('loadeddata',()=>{slot.el=v;slot.ready=true;updateUI()},{once:true});v.addEventListener('error',()=>{slot.ready=false},{once:true})}
SLOTS.forEach(slot=>{slot.ready=false;
  fetch(slot.file).then(r=>r.ok?r.blob():null).then(b=>{if(b&&b.size>1000)attachVideo(slot,URL.createObjectURL(b))})
    .catch(()=>{if(location.protocol==='file:')attachVideo(slot,slot.file)})});
const slotNow=()=>SLOTS.find(s=>clock>=s.t&&clock<s.t+SLOT_LENGTHS[s.id]);
function syncSlots(){SLOTS.forEach(slot=>{if(!slot.ready)return;const v=slot.el,len=SLOT_LENGTHS[slot.id],rel=clock-slot.t,inside=rel>=0&&rel<len,local=slotLocal(slot,rel),end=(v.duration||len)-.05;
  if(inside&&playing){v.muted=muted;v.playbackRate=slot.rate||1;v.volume=VOICE.some(x=>clock>=x.t-.15&&clock<x.t+x.d+.2)?.015:.05;if(local<end){if(v.paused){v.currentTime=local;v.play().catch(()=>{})}else if(Math.abs(v.currentTime-local)>.3)v.currentTime=local}}
  else{if(!v.paused)v.pause();if(inside&&Math.abs(v.currentTime-Math.min(local,end))>.05)v.currentTime=Math.min(local,end)}})}
function note(f,dur,type,vol,delay=0){if(muted||!actx)return;const o=actx.createOscillator(),g=actx.createGain(),at=actx.currentTime+delay;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+.01);g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(g).connect(actx.destination);o.start(at);o.stop(at+dur+.05)}
function chime(big){[784,988,1175,1568].slice(0,big?4:3).forEach((f,i)=>note(f,.4,'triangle',.05,.05+i*.07))}
function bell(f,soft){note(f,1.6,'sine',soft?.025:.045);note(f*2.76,.5,'sine',soft?.006:.012);note(f*5.4,.25,'sine',.004)}
function startPad(){try{ensureCtx();if(pad)return;const master=actx.createGain();master.gain.value=0;const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;lp.connect(master).connect(actx.destination);
  const oscs=[110,164.8,220,277.2].map((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=i%2?'triangle':'sine';o.frequency.value=f;o.detune.value=(i-1.5)*4;g.gain.value=[.5,.25,.18,.1][i];o.connect(g).connect(lp);o.start();return o});pad={master,oscs}}catch{}}
const PAD_ROOTS=[98,110];
const chapterIndex=()=>{let i=0;CHAPTERS.forEach((ch,j)=>{if(clock>=ch.t)i=j});return i};
function updatePad(){if(!pad)return;const root=PAD_ROOTS[chapterIndex()];pad.oscs.forEach((o,i)=>o.frequency.setTargetAtTime(root*[1,1.5,2,2.52][i],actx.currentTime,.8));
  const sl=slotNow(),duck=sl?(sl.ready?.2:.7):1;   // silent under real footage (it has the game's own sound)
  const vol=playing&&!muted?(speaking()?.022:.035)*duck*(1-seg(clock,DURATION-2,DURATION)):0;pad.master.gain.setTargetAtTime(vol,actx.currentTime,.4)}
function seek(t){clock=clamp(t,0,DURATION);prevClock=clock;stopClips();if(playing&&webAudio&&actx.state==='running')scheduleVoices();else syncClips();updateUI()}
function play(){if(clock>=DURATION)clock=0;playing=true;ensureCtx();startPad();last=performance.now();
  actx.resume().then(()=>{if(playing&&webAudio)scheduleVoices()});syncClips();updateUI();poke()}
function pause(){playing=false;stopClips();updatePad();updateUI();document.body.classList.remove('idle')}
function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
const track=$('#track');CHAPTERS.forEach(ch=>{if(!ch.t)return;const i=document.createElement('i');i.style.left=(ch.t/DURATION*100)+'%';i.title=ch.name;track.append(i)});
function updateUI(){const p=clock/DURATION*100;$('#fill').style.width=p+'%';$('#knob').style.left=p+'%';$('#time').textContent=fmt(clock)+' / '+fmt(DURATION);
  const ci=chapterIndex();$('#chap').textContent=`${ci+1}. ${CHAPTERS[ci].name}`;$('#pp').textContent=playing?'❚❚':'▶'}
let dragging=false;const toT=e=>{const r=track.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width,0,1)*DURATION};
track.addEventListener('pointerdown',e=>{dragging=true;track.setPointerCapture(e.pointerId);seek(toT(e))});track.addEventListener('pointermove',e=>{if(dragging)seek(toT(e))});track.addEventListener('pointerup',()=>dragging=false);
$('#pp').onclick=()=>playing?pause():play();
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent='Sound: '+(muted?'off':'on');if(voiceOut)voiceOut.gain.value=muted?0:1;syncClips();updatePad()};
$('#cc').onclick=()=>{captionsOn=!captionsOn;$('#cc').textContent='Captions: '+(captionsOn?'on':'off')};
$('#ui').onclick=()=>document.body.classList.toggle('hide-ui');
$('#fs').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch{}};
$('#play-start').disabled=true;$('#play-start').textContent='Loading voices…';
voicesReady.then(()=>{$('#play-start').disabled=false;$('#play-start').textContent='▶ Play the demo'});
$('#play-start').onclick=()=>{$('#start').hidden=true;play()};
let idleTimer=0;function poke(){document.body.classList.remove('idle');clearTimeout(idleTimer);if(playing)idleTimer=setTimeout(()=>document.body.classList.add('idle'),1800)}
addEventListener('pointermove',poke);
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;
  if(k===' '){e.preventDefault();if(!$('#start').hidden){$('#start').hidden=true;play()}else playing?pause():play()}
  else if(k==='ArrowRight')seek(clock+5);else if(k==='ArrowLeft')seek(clock-5);
  else if(k==='r'||k==='R'){seek(0);if(!$('#start').hidden)$('#start').hidden=true;play()}
  else if(k==='h'||k==='H')document.body.classList.toggle('hide-ui');
  else if(k==='m'||k==='M')$('#mute').click();else if(k==='f'||k==='F')$('#fs').click();else if(k==='c'||k==='C')$('#cc').click();
  else if(k==='k'||k==='K')cleanSlots=!cleanSlots;
  else if(k===']'||k==='['){const i=chapterIndex()+(k===']'?1:(clock-CHAPTERS[chapterIndex()].t<1?-1:0));if(CHAPTERS[i])seek(CHAPTERS[i].t+.01)}
  else{const i='1234567890-'.indexOf(k);if(i>=0&&CHAPTERS[i])seek(CHAPTERS[i].t+.01)}poke()});
$('#start p').textContent=`30-second demo · NASA Space Apps 2026 · ${fmt(DURATION)} · sound on`;
function readHash(){const h=new URLSearchParams(location.hash.slice(1));if(h.has('t'))seek(+h.get('t')||0);else if(h.has('ch')){const ch=CHAPTERS[(+h.get('ch')||1)-1];if(ch)seek(ch.t+.01)}}
readHash();addEventListener('hashchange',readHash);

function loop(now){
  if(playing){
    if(webAudio){if(scheduled)clock=clockBase+Math.max(0,actx.currentTime-ctxBase)}   // film clock = audio clock
    else if(!syncClips())clock+=Math.min(.25,(now-last)/1000);                          // fallback: wait while a clip loads
    if(clock>=DURATION){clock=DURATION;pause()}}
  last=now;syncSlots();
  if(playing){for(const b of BURSTS)if(prevClock<b.t&&clock>=b.t)chime(b.big);for(const b of BELLS)if(prevClock<b.t&&clock>=b.t)bell(b.f,b.soft);syncClips();updatePad();updateUI()}
  prevClock=clock;renderAt(clock);requestAnimationFrame(loop)}
updateUI();requestAnimationFrame(loop);
</script>
<style>
#recbtn{position:fixed;top:14px;right:14px;z-index:20;font:600 15px/1 system-ui,sans-serif;padding:11px 16px;border-radius:999px;border:1px solid #e9c46a;background:#1b140e;color:#f5e6c8;cursor:pointer}
#recbtn:hover{background:#2a1f15}
#rectip{position:fixed;top:58px;right:14px;z-index:20;font:13px/1.4 system-ui,sans-serif;color:#d8c8a8;background:#0b0907cc;padding:8px 12px;border-radius:10px;max-width:280px}
body.recording #recbtn,body.recording #rectip,body.recording #bar{display:none!important}
body.recording{cursor:none}
</style>
<button id="recbtn" type="button">● Record video</button>
<div id="rectip">Click, choose <b>this tab</b> . The film plays from the start and the video downloads when it ends.</div>
<script>
// one-click recording of this film in the viewer's own browser (smooth: uses the real GPU), with the tab's sound
document.getElementById('recbtn').onclick=async()=>{
  let stream;
  try{stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:60,width:{ideal:1920},height:{ideal:1080}},audio:false,preferCurrentTab:true,selfBrowserSurface:'include'})}
  catch(e){return}
  // sound comes straight from the film: narration (Web Audio) + gameplay clip at its in-film volume
  ensureCtx();const dest=actx.__dest=actx.__dest||actx.createMediaStreamDestination();
  const v=SLOTS[0].el,g=actx.createGain();try{actx.createMediaStreamSource(v.captureStream()).connect(g);window.__origConnect.call(g,dest)}catch(e){}
  const gainSync=setInterval(()=>{g.gain.value=(v.muted||v.paused)?0:v.volume},30);
  stream=new MediaStream([...stream.getVideoTracks(),...dest.stream.getAudioTracks()]);
  const mime=['video/mp4;codecs=avc1,mp4a','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12000000}),chunks=[];
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  document.body.classList.add('recording');document.getElementById('start').hidden=true;
  try{await voicesReady}catch{}
  pause();seek(0);
  await new Promise(r=>setTimeout(r,700));            // let the share bar settle
  rec.start(500);await new Promise(r=>setTimeout(r,300));play();
  await new Promise(done=>{const t=setInterval(()=>{if(clock>=DURATION-.01||stream.getVideoTracks()[0].readyState==='ended'){clearInterval(t);done()}},100)});
  await new Promise(r=>setTimeout(r,600));
  await new Promise(r=>{rec.onstop=r;rec.stop()});stream.getVideoTracks().forEach(t=>t.stop());clearInterval(gainSync);
  document.body.classList.remove('recording');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:mime}));
  a.download='ShadowsLeftBehind-demo.'+(mime.includes('mp4')?'mp4':'webm');document.body.append(a);a.click();a.remove();
};
</script>
